<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Settings</title>
<link rel="stylesheet" href="css/styles.css"/>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <div class="logo">WW</div>
      <div><h1>WW Operator Training</h1><div class="sub">Georgia-first wastewater operator training system</div></div>
    </div>
    <div class="nav"><a href="index.html">Home</a>
<a href="practice.html">Practice</a>
<a href="tests.html">Tests</a>
<a href="study.html">Study</a>
<a href="progress.html">Progress</a>
<a href="profile.html">Profile</a>
<a href="settings.html">Settings</a></div>
  </div>

<div class="grid">
  <div class="card half">
    <h2>Experience Settings</h2>
    <div class="row"><label><input type="checkbox" id="soundToggle"/> Sound effects</label></div>
    <div class="row"><label><input type="checkbox" id="motionToggle"/> Reduced motion</label></div>
    <div class="row" style="margin-top:12px"><label>Preferred startup mode</label><select id="preferredMode"><option value="practice">Practice</option><option value="tests">Tests</option><option value="study">Study</option><option value="progress">Progress</option></select></div>
    <div class="row" style="margin-top:12px"><button class="btn primary" id="saveSettingsBtn">Save Settings</button></div>
  </div>
  <div class="card half">
    <h2>Onboarding</h2>
    <div class="small">Reset onboarding if you want to test the first-run experience again.</div>
    <div class="row" style="margin-top:12px"><button class="btn warn" id="resetOnboardingBtn">Reset Onboarding</button></div>
    <div class="notice" id="settingsStatus" style="margin-top:12px">Ready.</div>
  </div>
</div>

  <div class="footer">WW Operator Training • v3 refactor</div>
</div>
<script type="module" src="js/pages/settings_page.js"></script>
</body>
</html>
